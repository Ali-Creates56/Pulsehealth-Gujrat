# ================================================================
# PulseHealth Gujrat — GitHub Pages Deployment
# 
# This workflow generates config.js from a GitHub Secret at deploy
# time so the Mapbox token never exists in the repository source.
#
# SETUP (one-time):
#   1. Go to your repo → Settings → Secrets and variables → Actions
#   2. Click "New repository secret"
#   3. Name:  MAPBOX_TOKEN
#   4. Value: paste your Mapbox token (starts with pk.eyJ...)
#   5. Click "Add secret"
#   6. Push this file and the workflow will auto-deploy!
# ================================================================

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:  # Allow manual triggers

# Grant GITHUB_TOKEN permission to deploy to Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Only allow one deployment at a time
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Inject the Mapbox token into config.js from GitHub Secrets
      - name: Generate config.js from secret
        run: |
          cat > config.js << 'TEMPLATE'
          /**
           * PulseHealth Gujrat — Auto-generated Configuration
           * Generated by GitHub Actions at deploy time.
           * Token is sourced from GitHub Secrets — never stored in repo.
           */
          TEMPLATE
          echo "window.__CONFIG__ = { MAPBOX_TOKEN: '${{ secrets.MAPBOX_TOKEN }}' };" >> config.js

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
